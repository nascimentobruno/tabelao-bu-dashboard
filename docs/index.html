<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GRUPO VPL</title>
  <link rel="stylesheet" href="assets/style.css">

  <!-- CSS extra só pra abas + consolidado (sem depender do style.css) -->
  <style>
    .tabsbar{
      display:flex; gap:10px; align-items:center; justify-content:center;
      padding:14px 14px 0 14px;
    }
    .tab-btn{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: inherit;
      padding:10px 16px;
      border-radius: 999px;
      cursor:pointer;
      font-weight: 800;
      letter-spacing:.2px;
      transition: transform .08s ease, background .15s ease;
      user-select:none;
      white-space: nowrap;
    }
    .tab-btn:hover{ transform: translateY(-1px); }
    .tab-btn.active{
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
    }

    .consolidated-wrap{
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:none;
    }
    .consolidated-grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      align-items: stretch;
    }
    .mini-cards{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .mini-card{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      border-radius: 14px;
      padding: 12px 12px;
      display:flex;
      gap: 10px;
      align-items:center;
      min-height: 64px;
    }
    .mini-ico{
      width: 42px; height:42px;
      border-radius: 12px;
      display:flex; align-items:center; justify-content:center;
      background: rgba(255,255,255,.10);
      flex: 0 0 42px;
      font-size: 20px;
    }
    .mini-meta{ line-height: 1.2; }
    .mini-title{ font-weight:800; opacity:.9; font-size: 13px; }
    .mini-value{ font-weight:900; font-size: 16px; margin-top: 4px; }
    .mini-sub{ font-size: 12px; opacity: .75; margin-top: 2px; }

    .chart-card{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      border-radius: 14px;
      padding: 12px;
      overflow:hidden;
      position: relative;
    }
    .chart-title{
      font-weight: 950;
      margin: 0 0 8px 0;
      font-size: 14px;
      opacity:.95;
    }

    /* Chips scrolláveis (melhor UX) */
    .chart-legend{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0 10px 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .chart-legend::-webkit-scrollbar{ height: 0; }

    .loading-inline{
      font-size:12px; opacity:.8; margin-top:8px;
    }
    .muted2{ opacity:.7; }

    /* destaque no header clicável */
    .data-table thead th.metric-selected{
      outline: 2px solid rgba(255,255,255,.22);
      outline-offset: -2px;
      border-radius: 10px;
    }

    @media (max-width: 980px){
      .consolidated-grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <!-- LOGIN OVERLAY -->
  <div id="loginOverlay" class="login-overlay" aria-hidden="true">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-mark">T</div>

        </div>

        <button id="btnLogin" class="login-btn" type="button">Entrar</button>

        <div class="login-hint">

    </div>

  <!-- APP -->
  <div class="layout" id="appRoot" style="visibility:hidden;">
    <aside class="sidebar" id="sidebar">
      <div class="brand">Grupo VPL</div>

      <div class="month-filter">
        <label for="monthFilter">Mês</label>

      <button class="nav-btn" data-bu="carbuy" type="button">Carbuy</button>

                <div class="mini-ico">📈</div>

        <!-- TABLE -->

      </div>

<script>
/* =========================
   CONFIG
   ========================= */
const SENHA_PADRAO = "42779103353";
const AUTH_KEY = "tabelao_auth_ok_v1";
const MANIFEST_URL = "data/manifest.json";
const PAGE_CHUNK_RENDER = 200;

/* =========================
   HELPERS
   ========================= */
async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function setMsg(el, text, kind="") {
  el.textContent = text;
  el.className = "login-msg" + (kind ? ` ${kind}` : "");
}

function showEmpty(msg) {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  thead.innerHTML = "<tr><th>Status</th></tr>";
  tbody.innerHTML = `<tr><td>${msg}</td></tr>`;
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status} ao buscar ${url}`);
  return await res.json();
}

/* =========================
   FORMATAÇÃO (R$ / %)
   ========================= */
const MONEY_COLS = new Set([
  "R$ Estoque","Faturamento","CPC","CPC (R$)","CPC R$",
  "Receita","Receita (R$)","Investimento","Gasto","Spend"
]);

const PERCENT_COLS = new Set([
  "CTR","CTR (%)","CTR %",
  "Conversão","Conversão (%)","Taxa de Conversão",
  "Eficiência"
]);

function toNumber(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;

  if (typeof v === "string") {
    let s = v.trim();
    if (!s) return null;
    s = s.replace(/\s/g, "").replace("R$", "").replace("%", "");
    if (s.includes(",")) {
      s = s.replace(/\./g, "").replace(",", ".");
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function formatPercentSmart(n) {
  const pct = (n >= 0 && n <= 1) ? n * 100 : n;
  return pct.toLocaleString("pt-BR", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + "%";
}

function formatCell(col, v) {
  if (v === null || v === undefined) return "";

  if (MONEY_COLS.has(col)) {
    const n = toNumber(v);
    if (n === null) return String(v);
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  if (PERCENT_COLS.has(col)) {
    const n = toNumber(v);
    if (n === null) return String(v);
    return formatPercentSmart(n);
  }

  if (col === "Estoque") {
    const n = toNumber(v);
    if (n === null) return String(v);
    return Math.round(n).toLocaleString("pt-BR");
  }

  if (typeof v === "number") return v.toLocaleString("pt-BR");
  return String(v);
}

/* =========================
   LOGIN
   ========================= */
function isAuthed() {
  return localStorage.getItem(AUTH_KEY) === "1";
}

async function doLogin() {
  const pwd = document.getElementById("pwd").value || "";
  const msg = document.getElementById("loginMsg");

  if (!pwd.trim()) {
    setMsg(msg, "Digite a senha.", "err");
    return;
  }

  const [h1, h2] = await Promise.all([sha256(pwd), sha256(SENHA_PADRAO)]);
  if (h1 === h2) {
    localStorage.setItem(AUTH_KEY, "1");
    setMsg(msg, "OK! Entrando…", "ok");
    await bootApp();
  } else {
    setMsg(msg, "Senha incorreta.", "err");
  }
}

function doLogout() {
  localStorage.removeItem(AUTH_KEY);
  location.reload();
}

/* =========================
   APP STATE
   ========================= */
let manifestCache = null;
let currentBU = "imoveis";
let currentMonth = "ALL";       // ALL | yyyy-mm
let currentView = "daily";      // daily | consolidated

let loadedRows = [];
let partsForSelection = [];
let nextPartIndex = 0;
let renderLimit = PAGE_CHUNK_RENDER;

function resetState() {
  loadedRows = [];
  partsForSelection = [];
  nextPartIndex = 0;
  renderLimit = PAGE_CHUNK_RENDER;
}

function monthLabel(yyyyMM){
  if (!yyyyMM) return "—";
  if (yyyyMM.length !== 7) return yyyyMM;
  const mesNum = yyyyMM.slice(5,7);
  const meses = {
    "01":"Jan","02":"Fev","03":"Mar","04":"Abr",
    "05":"Mai","06":"Jun","07":"Jul","08":"Ago",
    "09":"Set","10":"Out","11":"Nov","12":"Dez"
  };
  return meses[mesNum] || mesNum;
}

function resolveMonth(manifest) {
  if (currentMonth !== "ALL") return currentMonth;
  const months = (manifest.months || []);
  return months.length ? months[months.length - 1] : "";
}

function buildPartsUrl(part) {
  let filePath = String(part.file || "").replace(/^\/+/, "");
  const needsPrefix =
    !(filePath.startsWith("imoveis/") || filePath.startsWith("carbuy/") || filePath.startsWith("veiculos/"));

  return needsPrefix
    ? `data/${currentBU}/${filePath}`
    : `data/${filePath}`;
}

/* =========================
   TABLE RENDER
   ========================= */
function renderTableWithRows(rows, opts={}) {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  thead.innerHTML = "";
  tbody.innerHTML = "";

  if (!rows || rows.length === 0) {
    showEmpty(opts.emptyMsg || "Sem dados.");
    return;
  }

  const first = rows.find(r => r && typeof r === "object") || rows[0];
  const cols = Object.keys(first).filter(c => c !== "__month");

  thead.innerHTML = "<tr>" + cols.map(c => `<th>${c}</th>`).join("") + "</tr>";

  const limit = (opts.limit != null) ? opts.limit : rows.length;
  const slice = rows.slice(0, limit);

  for (const row of slice) {
    const tr = document.createElement("tr");
    for (const c of cols) {
      const td = document.createElement("td");
      td.textContent = formatCell(c, row[c]);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }

  if (opts.controls) {
    const trCtrl = document.createElement("tr");
    const tdCtrl = document.createElement("td");
    tdCtrl.colSpan = cols.length;

    const shown = slice.length;
    const totalLoaded = rows.length;

    const hasMoreRender = shown < totalLoaded;
    const hasMoreDownload = opts.hasMoreDownload === true;

    tdCtrl.innerHTML = `
      <div class="table-controls">
        <div class="table-controls__info">
          Mostrando <b>${shown}</b> de <b>${totalLoaded}</b> linhas baixadas
          ${hasMoreDownload ? "<span class='muted'>(mais dados disponíveis para baixar)</span>" : "<span class='muted'>(tudo baixado)</span>"}
        </div>
        <div class="table-controls__actions">
          ${hasMoreRender ? `<button id="btnMoreRender" class="mini-btn" type="button">Mostrar +${PAGE_CHUNK_RENDER}</button>` : ""}
          ${hasMoreDownload ? `<button id="btnMoreDownload" class="mini-btn strong" type="button">Baixar próxima parte</button>` : ""}
        </div>
      </div>
    `;

    trCtrl.appendChild(tdCtrl);
    tbody.appendChild(trCtrl);

    const btnMoreRender = document.getElementById("btnMoreRender");
    if (btnMoreRender) btnMoreRender.onclick = () => { renderLimit += PAGE_CHUNK_RENDER; renderDaily(); };

    const btnMoreDownload = document.getElementById("btnMoreDownload");
    if (btnMoreDownload) btnMoreDownload.onclick = async () => { await downloadNextPart(); };
  }
}

/* =========================
   VISÃO DIÁRIA
   ========================= */
async function downloadNextPart() {
  if (nextPartIndex >= partsForSelection.length) return;

  const part = partsForSelection[nextPartIndex];
  nextPartIndex += 1;

  showEmpty(`Baixando parte ${nextPartIndex}/${partsForSelection.length}…`);

  const url = buildPartsUrl(part);
  const rows = await fetchJson(url);
  loadedRows = loadedRows.concat(rows);

  renderDaily();
}

async function loadSelectionDaily() {
  if (!manifestCache) return;

  resetState();
  const chosenMonth = resolveMonth(manifestCache);

  if (!chosenMonth) {
    showEmpty("Sem meses disponíveis no manifest.");
    return;
  }

  const buMap = (manifestCache.files && manifestCache.files[currentBU]) ? manifestCache.files[currentBU] : {};
  const parts = buMap[chosenMonth] || [];

  if (!parts.length) {
    showEmpty(`Sem dados para ${currentBU} no mês ${chosenMonth}.`);
    return;
  }

  partsForSelection = parts;
  nextPartIndex = 0;

  await downloadNextPart();
}

function renderDaily() {
  document.getElementById("consolidatedWrap").style.display = "none";
  renderTableWithRows(loadedRows, {
    emptyMsg: "Nenhuma linha carregada ainda.",
    limit: renderLimit,
    controls: true,
    hasMoreDownload: nextPartIndex < partsForSelection.length
  });
}

/* =========================
   CONSOLIDADO (AGREGAÇÃO)
   ========================= */
function aggModeForCol(col){
  const c = String(col || "");
  const lc = c.toLowerCase();
  if (PERCENT_COLS.has(c)) return "avg";
  if (lc.includes("taxa") || lc.includes("convers") || lc.includes("ctr")) return "avg";
  if (lc.includes("cpc") || lc.includes("ticket") || lc.includes("médio") || lc.includes("medio")) return "avg";
  return "sum";
}

function computeAggFromRows(rows){
  if (!rows || !rows.length) return { row: null, cols: [] };

  const first = rows.find(r => r && typeof r === "object") || rows[0];
  const cols = Object.keys(first).filter(c => c !== "__month");

  const sums = {};
  const counts = {};
  const out = {};

  for (const col of cols) {
    if (col === "Mês") continue;
    sums[col] = 0;
    counts[col] = 0;
  }

  for (const r of rows) {
    if (!r || typeof r !== "object") continue;
    for (const col of cols) {
      if (col === "Mês") continue;
      const n = toNumber(r[col]);
      if (n === null) continue;
      sums[col] += n;
      counts[col] += 1;
    }
  }

  for (const col of cols) {
    if (col === "Mês") continue;
    if (counts[col] === 0) continue;
    const mode = aggModeForCol(col);
    out[col] = (mode === "avg") ? (sums[col] / counts[col]) : sums[col];
  }

  return { row: out, cols };
}

async function fetchAndAggregateMonth(bu, month){
  const buMap = (manifestCache.files && manifestCache.files[bu]) ? manifestCache.files[bu] : {};
  const parts = buMap[month] || [];
  if (!parts.length) return null;

  let allRows = [];
  for (let i=0;i<parts.length;i++){
    let filePath = String(parts[i].file || "").replace(/^\/+/, "");
    const needsPrefix =
      !(filePath.startsWith("imoveis/") || filePath.startsWith("carbuy/") || filePath.startsWith("veiculos/"));

    const url = needsPrefix ? `data/${bu}/${filePath}` : `data/${filePath}`;
    const rows = await fetchJson(url);
    allRows = allRows.concat(rows);
  }

  const { row } = computeAggFromRows(allRows);
  return row || null;
}

/* =========================
   CHART (SVG)
   ========================= */
function renderLineChartSVG(labels, series){
  const W = 920, H = 240;
  const padL = 42, padR = 16, padT = 10, padB = 34;
  const iw = W - padL - padR;
  const ih = H - padT - padB;

  let maxY = 0;
  for (const s of series){
    for (const v of s.values){
      const n = toNumber(v);
      if (n !== null) maxY = Math.max(maxY, n);
    }
  }
  if (maxY <= 0) maxY = 1;

  const xFor = (i) => padL + (labels.length <= 1 ? 0 : (i * (iw / (labels.length - 1))));
  const yFor = (v) => {
    const n = toNumber(v) ?? 0;
    const t = n / maxY;
    return padT + (ih * (1 - t));
  };

  const gridLines = 4;
  let grid = "";
  for (let i=0;i<=gridLines;i++){
    const y = padT + (ih * (i/gridLines));
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,.10)" />`;
  }

  let xLabels = "";
  labels.forEach((lb, i) => {
    const x = xFor(i);
    const t = lb.length > 5 ? lb.slice(0,5) : lb;
    xLabels += `<text x="${x}" y="${H-12}" fill="rgba(255,255,255,.75)" font-size="11" text-anchor="middle">${t}</text>`;
  });

  let paths = "";
  series.forEach(s => {
    let d = "";
    s.values.forEach((v,i) => {
      const x = xFor(i), y = yFor(v);
      d += (i===0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
    });

    paths += `
      <path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
      ${s.values.map((v,i)=> {
        const x = xFor(i), y = yFor(v);
        return `<circle cx="${x}" cy="${y}" r="3.5" fill="${s.color}" />`;
      }).join("")}
    `;
  });

  const svg = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="240" role="img" aria-label="Gráfico de evolução mensal">
      ${grid}
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="rgba(255,255,255,.16)" />
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="rgba(255,255,255,.16)" />
      ${paths}
      ${xLabels}
    </svg>
  `;

  document.getElementById("chartBox").innerHTML = svg;
}

/* =========================================================
   CONSOLIDADO INTERATIVO (métrica clicável)
   ========================================================= */
const CONSOLIDATED_METRICS = [
  "Vendas","Vendas M-0","Estoque","Eficiência","R$ Estoque","Faturamento",
  "Cli Lanc M0","Cli Compr M0","Lances","Cad Enc","Cad Aut","Envios","Entrega",
  "Leitura","Clique","Alcance","CPC","CTR","Seguidores"
];

let consolidatedCache = [];
let selectedMetricName = "Vendas";

function getAvailableMetricsFromData(rows){
  if (!rows || !rows.length) return [];
  const sample = rows[0] || {};

  const preferred = CONSOLIDATED_METRICS.filter(m => Object.prototype.hasOwnProperty.call(sample, m));
  const extras = Object.keys(sample)
    .filter(k => k !== "Mês" && k !== "__month" && !preferred.includes(k))
    .filter(k => rows.some(r => toNumber(r[k]) !== null));

  return preferred.concat(extras);
}

function setMini(idVal, idSub, valueText, subText){
  document.getElementById(idVal).textContent = valueText || "—";
  document.getElementById(idSub).textContent = subText || "—";
}

function setSelectedMetric(metric){
  if (!metric) return;
  selectedMetricName = metric;
  updateConsolidatedUI();
}

function renderMetricSelector(metrics){
  const el = document.getElementById("chartLegend");
  el.innerHTML = "";

  metrics.forEach(m => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = m;
    b.className = "tab-btn" + (m === selectedMetricName ? " active" : "");
    b.style.padding = "8px 12px";
    b.style.fontWeight = "900";
    b.addEventListener("click", () => setSelectedMetric(m));
    el.appendChild(b);
  });
}

function updateMiniCardsByMetric(metric){
  const rows = consolidatedCache;
  if (!rows || !rows.length) return;

  let best = null, worst = null;

  for (const r of rows){
    const n = toNumber(r[metric]);
    if (n === null) continue;
    if (!best || n > (toNumber(best[metric]) ?? -Infinity)) best = r;
    if (!worst || n < (toNumber(worst[metric]) ?? Infinity)) worst = r;
  }

  setMini("bestMonthVal","bestMonthSub",
    best ? best["Mês"] : "—",
    best ? `${metric}: ${formatCell(metric, best[metric])}` : `Base: ${metric}`
  );

  setMini("worstMonthVal","worstMonthSub",
    worst ? worst["Mês"] : "—",
    worst ? `${metric}: ${formatCell(metric, worst[metric])}` : `Base: ${metric}`
  );

  if (rows.length >= 2) {
    const last = rows[rows.length - 1];
    const prev = rows[rows.length - 2];
    const a = toNumber(prev[metric]);
    const b = toNumber(last[metric]);

    if (a !== null && b !== null && a !== 0) {
      const g = ((b - a) / Math.abs(a)) * 100;
      setMini("growthVal","growthSub", formatPercentSmart(g), `Base: ${metric} (${prev["Mês"]} → ${last["Mês"]})`);
    } else if (a !== null && b !== null) {
      setMini("growthVal","growthSub", formatCell(metric, (b - a)), `Base: ${metric} (${prev["Mês"]} → ${last["Mês"]})`);
    } else {
      setMini("growthVal","growthSub","—", `Base: ${metric}`);
    }
  } else {
    setMini("growthVal","growthSub","—", `Base: ${metric}`);
  }
}

function updateConsolidatedChartByMetric(metric){
  const labels = consolidatedCache.map(r => r["Mês"]);
  const values = consolidatedCache.map(r => toNumber(r[metric]) ?? 0);
  renderLineChartSVG(labels, [{ name: metric, color: "#55e37b", values }]);
}

function wireHeaderClicks(metrics){
  const thead = document.getElementById("thead");
  if (!thead) return;

  thead.querySelectorAll("th").forEach(th => {
    const name = (th.textContent || "").trim();
    const ok = metrics.includes(name);

    th.onclick = null;
    th.classList.remove("metric-selected");
    th.style.cursor = "";
    th.style.userSelect = "";

    if (!ok) return;

    th.style.cursor = "pointer";
    th.style.userSelect = "none";
    if (name === selectedMetricName) th.classList.add("metric-selected");
    th.onclick = () => setSelectedMetric(name);
  });
}

function updateConsolidatedUI(){
  if (!consolidatedCache || !consolidatedCache.length) return;

  const available = getAvailableMetricsFromData(consolidatedCache);
  if (!available.length) return;

  if (!available.includes(selectedMetricName)) selectedMetricName = available[0];

  const t = document.getElementById("chartTitle");
  if (t) t.textContent = `Evolução Mensal • ${selectedMetricName}`;

  renderMetricSelector(available);
  updateConsolidatedChartByMetric(selectedMetricName);
  updateMiniCardsByMetric(selectedMetricName);
  wireHeaderClicks(available);
}

/* =========================
   CONSOLIDADO - LOAD
   ========================= */
async function loadSelectionConsolidated() {
  if (!manifestCache) return;

  document.getElementById("consolidatedWrap").style.display = "block";
  document.getElementById("consolidatedStatus").textContent = "Montando consolidado…";

  let months = (manifestCache.months || []).slice();
  if (!months.length){
    showEmpty("Sem meses disponíveis no manifest.");
    return;
  }

  if (currentMonth !== "ALL") months = months.filter(m => m === currentMonth);

  const consolidated = [];
  for (let i=0;i<months.length;i++){
    const m = months[i];
    document.getElementById("consolidatedStatus").textContent =
      `Consolidando ${monthLabel(m)} (${i+1}/${months.length})…`;

    const agg = await fetchAndAggregateMonth(currentBU, m);
    if (!agg) continue;

    consolidated.push({ "Mês": monthLabel(m), ...agg, "__month": m });
  }

  if (!consolidated.length){
    showEmpty("Sem dados para consolidar.");
    document.getElementById("consolidatedStatus").textContent = "Sem dados.";
    setMini("bestMonthVal","bestMonthSub","—","—");
    setMini("worstMonthVal","worstMonthSub","—","—");
    setMini("growthVal","growthSub","—","—");
    document.getElementById("chartLegend").innerHTML = "";
    document.getElementById("chartBox").innerHTML = "";
    return;
  }

  consolidated.sort((a,b)=> String(a.__month).localeCompare(String(b.__month)));
  consolidatedCache = consolidated;

  const available = getAvailableMetricsFromData(consolidatedCache);
  selectedMetricName = available.includes("Vendas") ? "Vendas" : (available[0] || "Vendas");

  const tableRows = consolidated.map(r => {
    const copy = {...r};
    delete copy.__month;
    return copy;
  });

  renderTableWithRows(tableRows, { emptyMsg: "Sem dados consolidados." });
  updateConsolidatedUI();

  document.getElementById("consolidatedStatus").textContent =
    `Consolidado pronto: ${currentBU.toUpperCase()} • ${currentMonth === "ALL" ? "Todos os meses" : monthLabel(currentMonth)}`;
}

/* =========================
   UI / NAV
   ========================= */
function populateUIFromManifest(manifest) {
  const sel = document.getElementById("monthFilter");
  const keep = sel.value || "ALL";
  sel.innerHTML = "";

  const optAll = document.createElement("option");
  optAll.value = "ALL";
  optAll.textContent = "Todos";
  sel.appendChild(optAll);

  (manifest.months || []).forEach(m => {
    const o = document.createElement("option");
    o.value = m;
    o.textContent = monthLabel(m);
    sel.appendChild(o);
  });

  sel.value = keep;

  document.getElementById("sourceSubtitle").textContent = `Fonte: ${manifest.source || "—"}`;
  document.getElementById("updatedBox").innerHTML = `
    <div style="font-size:12px;opacity:.75;margin-bottom:8px;">
      Desenvolvido por Bruno Nascimento
    </div>
    Atualizado:<br>${manifest.generated_at || "—"}
  `;
}

function setTab(view){
  currentView = view;

  const tDaily = document.getElementById("tabDaily");
  const tCons = document.getElementById("tabConsolidated");
  tDaily.classList.toggle("active", view === "daily");
  tCons.classList.toggle("active", view === "consolidated");

  refreshCurrentView();
}

async function refreshCurrentView(){
  if (!manifestCache) return;

  if (currentView === "daily") {
    await loadSelectionDaily();
  } else {
    showEmpty("Carregando consolidado…");
    await loadSelectionConsolidated();
  }
}

function wireEvents() {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentBU = btn.dataset.bu;
      await refreshCurrentView();
    });
  });

  const monthFilter = document.getElementById("monthFilter");
  monthFilter.addEventListener("change", async () => {
    currentMonth = monthFilter.value;
    await refreshCurrentView();
  });

  document.getElementById("btnToggleSidebar").addEventListener("click", () => {
    document.body.classList.toggle("sidebar-collapsed");
  });

  document.getElementById("btnLogout").addEventListener("click", doLogout);

  document.getElementById("btnLogin").addEventListener("click", doLogin);
  document.getElementById("pwd").addEventListener("keydown", (e) => {
    if (e.key === "Enter") doLogin();
  });
  document.getElementById("btnTogglePwd").addEventListener("click", () => {
    const el = document.getElementById("pwd");
    el.type = (el.type === "password") ? "text" : "password";
  });

  document.getElementById("tabDaily").addEventListener("click", () => setTab("daily"));
  document.getElementById("tabConsolidated").addEventListener("click", () => setTab("consolidated"));
}

async function bootApp() {
  const overlay = document.getElementById("loginOverlay");
  overlay.style.display = "none";
  overlay.setAttribute("aria-hidden", "true");

  const appRoot = document.getElementById("appRoot");
  appRoot.style.visibility = "visible";

  showEmpty("Carregando manifest…");
  manifestCache = await fetchJson(MANIFEST_URL);
  populateUIFromManifest(manifestCache);

  const sel = document.getElementById("monthFilter");
  currentMonth = sel.value || "ALL";

  await refreshCurrentView();
}

/* =========================
   START
   ========================= */
(async function start() {
  wireEvents();

  const overlay = document.getElementById("loginOverlay");
  overlay.style.display = "flex";
  overlay.setAttribute("aria-hidden", "false");

  if (isAuthed()) {
    await bootApp();
  } else {
    document.getElementById("appRoot").style.visibility = "hidden";
  }
})();
</script>
